      <stop offset="0" stop-color="#0aad0a"/>
      <stop offset="1" stop-color="#087c08"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- decorative soft circles -->
  <circle cx="410" cy="60" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="70" cy="250" r="90" fill="#ffffff" opacity="0.06"/>
