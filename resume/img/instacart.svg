    <path d="M-16 -26 C 6 -34 26 -20 30 8 C 34 38 6 66 -14 60 C -34 54 -40 22 -34 -2 C -31 -14 -26 -22 -16 -26 Z" fill="#ff7009"/>
    <path d="M-10 -20 C -20 -6 -22 20 -14 44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.35"/>
  </g>
  <!-- wordmark -->
  <text x="240" y="215" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Instacart</text>
</svg>
