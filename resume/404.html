<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found · Dian Ding</title>
<link rel="icon" type="image/png" href="./img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070711; --txt:#e8e9f2; --muted:#9a9cb5;
    --a1:#7c5cff; --a2:#22d3ee; --a3:#f472b6;
    --card:rgba(255,255,255,.045); --card-brd:rgba(255,255,255,.09);
    --grad:linear-gradient(120deg,var(--a1),var(--a2));
    --grad-txt:linear-gradient(120deg,#a48bff,#4fe3f5 55%,#f79ccf);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);
    min-height:100vh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:24px}
  .orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(90px)}
  .orb{position:absolute;border-radius:50%;opacity:.5;animation:float 22s ease-in-out infinite}
  .orb.a{width:46vw;height:46vw;background:#6b3cff;top:-12vw;left:-8vw}
  .orb.b{width:40vw;height:40vw;background:#0ea5e9;bottom:-14vw;right:-12vw;animation-delay:-7s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3vw,3vh) scale(1.07)}}
  .wrap{max-width:520px}
  .code{font-family:'Space Grotesk';font-weight:700;font-size:clamp(5rem,20vw,10rem);line-height:1;
    background:var(--grad-txt);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-family:'Space Grotesk';font-size:clamp(1.3rem,4vw,1.8rem);margin:8px 0 14px}
  p{color:var(--muted);margin-bottom:30px;line-height:1.6}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:99px;
    font-weight:600;font-size:.95rem;background:var(--grad);color:#fff;text-decoration:none;
    box-shadow:0 10px 30px -8px rgba(124,92,255,.6);transition:.25s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px -8px rgba(124,92,255,.75)}
  @media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<div class="orbs"><div class="orb a"></div><div class="orb b"></div></div>
<div class="wrap">
  <div class="code">404</div>
  <h1>This page wandered off</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
  <a class="btn" href="/">&larr; Back to home</a>
</div>
</body>
</html>
